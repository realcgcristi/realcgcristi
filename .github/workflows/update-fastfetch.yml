name: Update fastfetch

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fastfetch.py"]

permissions:
  contents: write

concurrency:
  group: fastfetch
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fastfetch.py
      - run: |
          git config user.name "realcgcristi"
          git config user.email "cgcristitm@gmail.com"
          git add fastfetch.svg fastfetch-mobile.svg
          git diff --cached --quiet || git commit -m "fastfetch: daily refresh"
          git push
